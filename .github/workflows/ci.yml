name: Aether AI CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Run Build
        env:
          MONGODB_URI: mongodb://localhost:27017/aether-test
          NEXTAUTH_SECRET: supersecret32charfortestciworkflowonly
          NEXTAUTH_URL: http://localhost:3000
        run: npm run build
